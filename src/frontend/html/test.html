<body>
    <header>
        <h1>매장 관리 프로그램 Ver1.0.</h1>

    <nav>
        <ul>
            <li><a href="button">매장별 매출액 등록</a></li>

        <form action="" method="post">
            <table>
                <tr>
                    <th>매장 선택</th>
                    <td>
                        <select name="store" required>
                            <option value="">매장선택</option>
                            <option value="100">코엑스점</option>
                            <option value="200">판교점</option>
                            <option value="300">경자고점</option>
                            <option value="400">일산점</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th colspan="2">매출액</th>
                </tr>
                <tr>
                    <th>1분기 매출액</th>
                    <td><input type="text" name="1s">만원</td>
                </tr>
                <tr>
                    <th>2분기 매출액</th>
                    <td><input type="text" name="1s">만원</td>
                </tr>
                <tr>
                    <th>3분기 매출액</th>
                    <td><input type="text" name="1s">만원</td>
                </tr>
                <tr>
                    <th>4분기 매출액</th>

                </tr>
            </table>
        </form>
    </section>
