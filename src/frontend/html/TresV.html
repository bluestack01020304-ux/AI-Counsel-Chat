<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>곰곰이 진로 센터 - 상담 일정 및 예약 관리</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/TresV.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-text">
          <h2>곰곰이</h2>
          <span>진로 지도 교사 센터</span>
        </div>
      </div>

      <button class="new-chat-btn" id="open-modal-btn">
        <i class="fa-solid fa-plus"></i> 일정 등록하기
      </button>

      <div class="chat-history">
        <div class="history-group">
          <span class="group-title">예약 필터</span>
          <ul class="filter-list">
            <li class="active"><i class="fa-solid fa-list-check"></i> 전체 예약</li>
            <li><i class="fa-solid fa-clock"></i> 대기 중인 예약</li>
            <li><i class="fa-solid fa-circle-check"></i> 확정된 예약</li>
            <li><i class="fa-solid fa-circle-xmark"></i> 취소/반려</li>
          </ul>
        </div>
      </div>

      <div class="user-profile">
        <div class="avatar-wrapper">
          <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=150&auto=format&fit=crop&q=80" alt="교사 프로필">
        </div>
        <div class="user-info">
          <div class="name">박진로 선생님</div>
          <div class="desc">2학년 3반 담임</div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div class="header-title">
          <h1>상담 일정 및 예약 관리</h1>
        </div>
        <div class="header-right">
          <span class="badge">2026학년도 2학기</span>
          <button class="logout-btn">로그아웃</button>
        </div>
      </header>

      <div class="schedule-container">
        <section class="calendar-section">
          <div class="section-card">
            <div class="calendar-header">
              <h2><i class="fa-regular fa-calendar-days"></i> 2026년 10월</h2>
              <div class="calendar-nav">
                <button class="icon-btn"><i class="fa-solid fa-chevron-left"></i></button>
                <button class="today-btn">오늘</button>
                <button class="icon-btn"><i class="fa-solid fa-chevron-right"></i></button>
              </div>
            </div>

            <div class="mini-calendar">
              <div class="weekdays">
                <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
              </div>
              <div class="days"></div>
            </div>

            <hr class="divider">

            <div class="timeslot-management">
              <div class="timeslot-header">
                <h3 id="timeslot-title">상담 가능 시간</h3>
                <span class="timeslot-status" id="timeslot-count">총 0개 슬롯</span>
              </div>
              <!-- API로 가져온 타임슬롯이 생성될 컨테이너 -->
              <div class="timeslot-grid" id="timeslot-grid">
                <!-- 동적 생성 영역 -->
              </div>
            </div>
          </div>
        </section>

        <section class="appointments-section">
          <div class="section-card">
            <div class="card-header">
              <h2><i class="fa-solid fa-clock-rotate-left"></i> 실시간 상담 신청 내역</h2>
              <span class="pending-count">대기 0건</span>
            </div>

            <div class="appointment-list">
              <!-- API로 가져온 예약 카드가 생성될 영역 -->
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="schedule-modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fa-regular fa-calendar-plus"></i> 새로운 상담 타임슬롯 오픈</h3>
        <button class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <form class="modal-form">
          <div class="form-group">
            <label>상담 날짜</label>
            <input type="date" value="2026-10-15">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>시작 시간</label>
              <input type="time" value="14:00">
            </div>
            <div class="form-group">
              <label>종료 시간</label>
              <input type="time" value="14:40">
            </div>
          </div>
          <div class="form-group">
            <label>상담 방식</label>
            <select>
              <option value="offline">방문 상담 (상담실)</option>
              <option value="online">온라인 화상 상담</option>
            </select>
          </div>
          <div class="form-group">
            <label>비고 및 전달사항</label>
            <textarea placeholder="학생들에게 사전 공지할 내용을 작성하세요..." rows="3"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline modal-close-btn">취소</button>
        <button class="btn btn-primary">타임슬롯 생성</button>
      </div>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/TresV.js"></script>
</body>
</html>
