<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>곰곰이 진로 라운지</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">🐻</div>
        <div class="logo-text">
          <h2>곰곰이</h2>
          <span>진로 상담 센터</span>
        </div>
      </div>

      <button class="new-chat-btn" id="new-chat-btn">
        <i class="fa-solid fa-pen"></i> 상담 새로 작성
      </button>

      <div class="chat-history">
        <div class="history-group">
          <span class="group-title">최근 상담 목록</span>
          <ul id="chat-list"></ul>
        </div>
      </div>

      <div class="user-profile">
        <div class="avatar-wrapper">
          <img src="https://i.pinimg.com/originals/9f/bc/f7/9fbcf73a3ac68a3d8db7bb778f239bf0.jpg" alt="프로필">
        </div>
        <div class="user-info">
          <div class="name" id="user-name">사용자</div>
          <div class="desc" id="user-desc">고등학교 2학년</div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div class="header-title">
          <h1>진로 상담 라운지</h1>
        </div>
        <button class="logout-btn" id="logout-btn">로그아웃</button>
      </header>

      <section class="welcome-section">
        <div class="main-banner">
          <div class="banner-text">
            <h2 id="welcome-title">안녕하세요!</h2>
            <p id="response-text">오늘 어떤 진로 고민을 나눠볼까요?</p>
          </div>
        </div>

        
        <div id="chat-messages" class="chat-messages" style="display: none;"></div>

        <div class="search-section">
          <div class="input-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="chat-input" placeholder="고민이나 질문 키워드를 입력해 보세요...">
            <button class="send-btn" id="send-btn">검색</button>
          </div>
        </div>

        <div class="recommend-wrapper" id="recommend-wrapper">
          <div class="section-title">
            <h3>맞춤 상담 메뉴</h3>
          </div>

          <div class="card-grid" id="card-grid">
            <!-- 상담 예약 카드 (클릭 시 이동) -->
            <div class="recommend-card" onclick="location.href='resV.html'" style="cursor: pointer;">
              <div class="card-icon"><i class="fa-regular fa-compass"></i></div>
              <div class="card-text">
                <h3>상담 예약</h3>
                <p>진로 선생님과의 상담 예약하기</p>
              </div>
            </div>

            <!-- 정시&수시 진학 가이드 카드 (클릭 시 이동) -->
            <div class="recommend-card" onclick="location.href='jinhak.html'" style="cursor: pointer;">
              <div class="card-icon"><i class="fa-solid fa-graduation-cap"></i></div>
              <div class="card-text">
                <h3>정시&수시 진학 가이드</h3>
                <p>정시&수시 세부 가이드</p>
              </div>
            </div>

            <div class="recommend-card" onclick="location.href='QuesT.html'" style="cursor: pointer;">
              <div class="card-icon"><i class="fa-regular fa-file-lines"></i></div>
              <div class="card-text">
                <h3>실전 면접 대비</h3>
                <p>자주 나오는 질문 모음과 예상 답변</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
