<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>곰곰이 AI - 로그인</title>
  <link rel="stylesheet" href="../css/login.css" />
</head> 
<body>

  <div class="card">
    <h1>곰곰이</h1>

    <form id="loginForm">
      <input type="text" id="email" name="username" placeholder="아이디" autocomplete="username" required />
      <input type="password" id="password" placeholder="비밀번호" required />
      <button type="submit">로그인</button>
    </form>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
