<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상담 후기 | 경기자동차과학고등학교 곰곰이</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/TresV.css">
  <link rel="stylesheet" href="../css/counselNote.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-text">
          <h2>곰곰이</h2>
          <span>진로 상담 센터</span>
        </div>
      </div>
      <div class="school-badge">
        <i class="fa-solid fa-school"></i>
        <span>경기자동차과학고등학교</span>
      </div>

      <button class="new-chat-btn" id="go-reservation-btn">
        <i class="fa-regular fa-calendar-check"></i> 상담 예약 화면으로
      </button>

      <div class="chat-history">
        <div class="history-group">
          <span class="group-title">기록 필터</span>
          <ul class="filter-list" id="filter-list">
            <li class="active" data-filter="all"><i class="fa-solid fa-list-check"></i> <span class="filter-label">전체 완료 상담</span></li>
            <li data-filter="todo"><i class="fa-solid fa-hourglass-half"></i> <span class="filter-label"></span></li>
            <li data-filter="done"><i class="fa-solid fa-circle-check"></i> <span class="filter-label"></span></li>
          </ul>
        </div>
      </div>

      <div class="user-profile">
        <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
        <div class="user-info">
          <div class="name" id="user-name">사용자</div>
          <div class="desc" id="user-desc"></div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div class="header-title">
          <h1>상담 후기</h1>
        </div>
        <div class="header-right">
          <span class="badge" id="role-badge"></span>
          <button class="logout-btn">로그아웃</button>
        </div>
      </header>

      <div class="schedule-container">
        <section class="section-card">
          <div class="card-header">
            <h2><i class="fa-solid fa-flag-checkered"></i> 완료된 상담</h2>
            <span class="pending-count" id="todo-count"></span>
          </div>
          <ul class="record-list" id="record-list"></ul>
        </section>

        <section class="section-card record-detail" id="record-detail">
          <div class="detail-empty">
            <i class="fa-regular fa-comments"></i>
            <p>왼쪽에서 완료된 상담을 선택하면 후기를 볼 수 있어요.</p>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/counselNote.js"></script>
</body>
</html>
