<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>곰곰이 진로 센터 - 학생 상담 예약 신청</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/TresV.css">
  <link rel="stylesheet" href="../css/resV.css">
</head>
<body>
  <div class="app-container">
    
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-text">
          <h2>곰곰이</h2>
          <span>진로 상담 센터</span>
        </div>
      </div>

      <button class="new-chat-btn" id="open-booking-modal-btn">
        <i class="fa-solid fa-calendar-plus"></i> 빠른 예약 신청
      </button>

      <div class="chat-history">
        <div class="history-group">
          <span class="group-title">내 예약 상태 필터</span>
          <ul class="filter-list">
            <li class="active"><i class="fa-solid fa-list-check"></i> 전체 신청 (<span data-count="전체">0</span>)</li>
            <li><i class="fa-solid fa-clock"></i> 승인 대기 중 (<span data-count="대기">0</span>)</li>
            <li><i class="fa-solid fa-circle-check"></i> 확정된 상담 (<span data-count="확정">0</span>)</li>
            <li><i class="fa-solid fa-circle-xmark"></i> 취소/반려 (<span data-count="취소">0</span>)</li>
          </ul>
        </div>
      </div>

      <div class="user-profile">
        <div class="avatar-wrapper">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="학생 프로필">
        </div>
        <div class="user-info">
          <div class="name">김민준</div>
          <div class="desc">고등학교 2학년 3반</div>
        </div>
      </div>
    </aside>

    <!-- 메인 컨텐츠 영역 -->
    <main class="main-content">
      <header class="top-header">
        <div class="header-title">
          <h1>선생님 진로 상담 신청</h1>
        </div>
        <div class="header-right">
          <span class="badge" id="teacher-badge">담당 선생님 확인 중...</span>
          <button class="logout-btn">로그아웃</button>
        </div>
      </header>

      <!-- 2열 메인 레이아웃 (달력 & 내 신청 목록) -->
      <div class="schedule-container">
        
        <!-- 왼쪽: 달력 및 선생님 상담 가능 시간 선택 -->
        <section class="calendar-section">
          <div class="section-card">
            <div class="calendar-header">
              <h2><i class="fa-regular fa-calendar-days"></i> 2026년 10월</h2>
              <div class="calendar-nav">
                <button class="icon-btn"><i class="fa-solid fa-chevron-left"></i></button>
                <button class="today-btn">오늘</button>
                <button class="icon-btn"><i class="fa-solid fa-chevron-right"></i></button>
              </div>
            </div>

            <!-- 월간 미니 달력 -->
            <div class="mini-calendar">
              <div class="weekdays">
                <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
              </div>
              <div class="days"></div>
            </div>

            <hr class="divider">

            <!-- 선택된 날짜의 오픈된 타임슬롯 -->
            <div class="timeslot-management">
              <div class="timeslot-header">
                <h3 id="timeslot-title">신청 가능 시간</h3>
                <span class="timeslot-status" id="timeslot-count">슬롯 선택 시 신청 가능</span>
              </div>
              <div class="timeslot-grid" id="timeslot-grid">
                <!-- API로 가져온 타임슬롯이 생성될 영역 -->
              </div>
            </div>
          </div>
        </section>

        <!-- 오른쪽: 내가 신청한 예약 내역 및 현황 -->
        <section class="appointments-section">
          <div class="section-card">
            <div class="card-header">
              <h2><i class="fa-solid fa-clock-rotate-left"></i> 나의 상담 신청 내역</h2>
              <span class="pending-count">대기 0건</span>
            </div>

            <div class="appointment-list">
              <!-- API로 가져온 내 예약 카드가 생성될 영역 -->
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <!-- 학생용 예약 신청 입력 모달 -->
  <div class="modal-backdrop" id="booking-modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fa-regular fa-calendar-check"></i> 상담 예약 신청서</h3>
        <button class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <form class="modal-form" id="booking-form">
          <div class="form-group">
            <label>상담 선생님</label>
            <input type="text" id="modal-teacher" value="" readonly style="background-color: #f8fafc; color: #475569;">
          </div>
          <div class="form-group">
            <label>선택한 일시</label>
            <input type="text" id="modal-selected-time" value="" readonly style="font-weight: 700; color: #2563eb; background-color: #eff6ff;">
          </div>
          <div class="form-group">
            <label>희망 상담 방식</label>
            <select id="modal-consult-type">
              <option value="offline">방문 상담 (상담실)</option>
              <option value="online">온라인 화상 상담 (Google Meet)</option>
            </select>
          </div>
          <div class="form-group">
            <label>상담 안건 및 고민 내용 <span style="color: #ef4444;">*</span></label>
            <textarea id="modal-consult-topic" placeholder="선생님께 말씀드리고 싶은 진로 고민, 관심 학과, 질문 등을 구체적으로 적어주세요..." rows="4" required></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline modal-close-btn">취소</button>
        <button class="btn btn-primary" id="submit-booking-btn">예약 신청 완료</button>
      </div>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/resV.js"></script>
</body>
</html>
