    <!DOCTYPE html>
    <html lang="ko">
    <head>
      <meta charset="UTF-8" />
      <title>곰곰이 AI - 로그인</title>
      <style>
          
          body {
                  font-family: sans-serif;
                  background: #f5f0e8;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  height: 100vh;
                }
                
                .card {
                  background: white;
                  padding: 40px;
                  border-radius: 12px;
                  width: 340px;
                  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
                  text-align: center;
                }
                
                h1 {
                  margin-bottom: 24px;
                }
                h3 {
                  margin-bottom: 24px;
                  color: gray;
                }
                
                input {
                  display: block;
                  width: 100%;
                  padding: 10px 12px;
                  margin-bottom: 12px;
                  border: 1px solid #ddd;
                  border-radius: 6px;
                  font-size: 14px;
                  box-sizing: border-box;
                }
                
                button {
                  width: 100%;
                  padding: 11px;
                  background: #8b5c2a;
                  color: white;
                  border: none;
                  border-radius: 6px;
                  font-size: 15px;
                  cursor: pointer;
                }
      </style>
    </head>
    <body>
    
      <div class="card">
        <h1>곰곰이</h1>
        <h3>진로 상담 AI ChatBot</h2>
    
        <form id="loginForm">
          <input type="email" id="email" placeholder="이메일" required />
          <input type="password" id="password" placeholder="비밀번호" required />
          <button type="submit">로그인</button>
        </form>
      </div>
    
      <script src="login.js"></script>
    </body>
    </html>
