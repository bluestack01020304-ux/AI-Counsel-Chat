<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>곰곰이 진로 라운지</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon"></div>
        <div class="logo-text">
          <h2>곰곰이</h2>
          <span>진로 상담 센터</span>
        </div>
      </div>

      <button class="new-chat-btn" id="new-chat-btn">
        <i class="fa-solid fa-pen"></i> 상담 새로 작성
      </button>

      <div class="chat-history">
        <div class="history-group">
          <span class="group-title">최근 상담 목록</span>
          <ul id="chat-list"></ul>
        </div>
      </div>

      <div class="user-profile">
        <div class="avatar-wrapper">
          <img src="https://www.bing.com/images/search?view=detailV2&ccid=Ej2uV6Xw&id=03AC70B859B37773B9CB1A78CC7983CFFF655C60&thid=OIP.Ej2uV6Xw-vcLtCDl2vVM-wHaNL&mediaurl=https%3a%2f%2fi.pinimg.com%2foriginals%2f9f%2fbc%2ff7%2f9fbcf73a3ac68a3d8db7bb778f239bf0.jpg&exph=1309&expw=736&q=%ea%b3%b0%eb%8f%84%eb%a7%81+%ed%91%b8&FORM=IRPRST&ck=24375E175C6AFD081C4CF4F6DC33D9BE&selectedIndex=0&itb=0" alt="프로필">
        </div>
        <div class="user-info">
          <div class="name" id="user-name">임균정</div>
          <div class="desc" id="user-desc">고등학교 2학년</div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div class="header-title">
          <h1>진로 상담 라운지</h1>
        </div>
        <button class="logout-btn" id="logout-btn">로그아웃</button>
      </header>

      <section class="welcome-section">
        <div class="main-banner">
          <div class="banner-text">
            <h2 id="welcome-title">안녕하세요, 균정님! </h2>
            <p id="response-text">오늘 어떤 진로 고민을 나눠볼까요?</p>
          </div>
        </div>

        
        <div id="chat-messages" class="chat-messages" style="display: none;"></div>

        <div class="search-section">
          <div class="input-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="chat-input" placeholder="고민이나 질문 키워드를 입력해 보세요...">
            <button class="send-btn" id="send-btn">검색</button>
          </div>
        </div>

        <div class="recommend-wrapper" id="recommend-wrapper">
          <div class="section-title">
            <h3>맞춤 상담 메뉴</h3>
          </div>

          <div class="card-grid" id="card-grid">
            <div class="recommend-card">
              <div class="card-icon"><i class="fa-regular fa-compass"></i></div>
              <div class="card-text">
                <h3>적성 진단 & 직업 매칭</h3>
                <p>내 성향에 맞는 직업군 찾아보기</p>
              </div>
            </div>

            <div class="recommend-card">
              <div class="card-icon"><i class="fa-solid fa-graduation-cap"></i></div>
              <div class="card-text">
                <h3>학과 탐색 가이드</h3>
                <p>관심 전공과 관련 학과 세부 가이드</p>
              </div>
            </div>

            <div class="recommend-card">
              <div class="card-icon"><i class="fa-regular fa-file-lines"></i></div>
              <div class="card-text">
                <h3>자기소개서 첨삭</h3>
                <p>스토리 구성 및 문장 다듬기</p>
              </div>
            </div>

            <div class="recommend-card">
              <div class="card-icon"><i class="fa-regular fa-comments"></i></div>
              <div class="card-text">
                <h3>실전 면접 대비</h3>
                <p>자주 나오는 질문 모음과 예상 답변</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
